server:
  port: ${PORT:8081}

spring:
  application:
    name: spendwise-backend
  datasource:
    url: jdbc:h2:mem:spendwise;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  demo-initial-wallet-balance: ${DEMO_INITIAL_WALLET_BALANCE:50000}
  security:
    jwt-secret: ${APP_JWT_SECRET:spendwise-local-development-secret-change-before-deployment-2026-very-long}
    jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:168}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
