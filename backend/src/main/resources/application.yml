server:
  port: ${PORT:8081}
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
spring:
  application:
    name: spendwise-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/spendwise}
    username: ${DB_USERNAME:spendwise}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: finance-projections-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      auto-startup: ${EVENTS_ENABLED:true}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  ml-service-key: ${ML_SERVICE_KEY}
  demo-initial-wallet-balance: ${DEMO_INITIAL_WALLET_BALANCE:0}
  demo:
    enabled: ${DEMO_ENABLED:false}
    password: ${DEMO_PASSWORD:}
  events:
    enabled: ${EVENTS_ENABLED:true}
  cache:
    enabled: ${CACHE_ENABLED:true}
  security:
    jwt-secret: ${APP_JWT_SECRET}
    jwt-expiration-minutes: 15
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: Lax
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
logging:
  structured:
    format:
      console: ecs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
