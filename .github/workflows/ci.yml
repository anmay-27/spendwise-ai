name: SpendWise CI
on: [push, pull_request]
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results
          path: '**/target/surefire-reports/*.xml'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt httpx
      - run: python -m pytest -q
  containers:
    runs-on: ubuntu-latest
    needs: [java, frontend, python]
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral local configuration
        shell: pwsh
        run: ./scripts/setup-local.ps1 -Demo
      - run: docker compose config --quiet && docker compose build
      - run: docker compose up -d --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
      - run: docker compose down
        if: always()
